# Release Please remains the only automatic release author. Its generated
# identity passes the same exact-SHA proof and package gate as recovery.
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # Optional: set secret RELEASE_PLEASE_TOKEN (fine-grained PAT) if the
          # default token cannot open Release PRs; otherwise github.token suffices.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  candidate:
    name: Verify exact tagged candidate and package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      checksum: ${{ steps.candidate.outputs.checksum }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install pinned Mix tools and dependencies
        run: |
          mix local.hex 2.5.1 --force
          curl -fsSLo "$RUNNER_TEMP/rebar3-3.25.1" https://github.com/erlang/rebar3/releases/download/3.25.1/rebar3
          echo '69073f6ad163f74971545015238614c327893960c1b3f26df5377df135c773a0716b48b65c2a48cef878f185dd92805abc69894adfa3fd27a90c62a64ba371e2  rebar3-3.25.1' | (cd "$RUNNER_TEMP" && sha512sum --check)
          mix local.rebar rebar3 "$RUNNER_TEMP/rebar3-3.25.1" --force
          mix deps.get

      - name: Validate Release Please identity
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node -e 'const tag = process.env.RELEASE_TAG; const version = process.env.RELEASE_VERSION; if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag || "") || !/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version || "") || tag.slice(1) !== version) { console.error("Release Please tag/version identity is invalid"); process.exit(1); }'

      - name: Prepare exact-SHA candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release_integrity.cjs prepare

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ steps.candidate.outputs.sha }}
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified candidate to Hex
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hex-production
    concurrency:
      group: hex-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ needs.candidate.outputs.sha }}

      - name: Install pinned Mix tools and dependencies
        run: |
          mix local.hex 2.5.1 --force
          curl -fsSLo "$RUNNER_TEMP/rebar3-3.25.1" https://github.com/erlang/rebar3/releases/download/3.25.1/rebar3
          echo '69073f6ad163f74971545015238614c327893960c1b3f26df5377df135c773a0716b48b65c2a48cef878f185dd92805abc69894adfa3fd27a90c62a64ba371e2  rebar3-3.25.1' | (cd "$RUNNER_TEMP" && sha512sum --check)
          mix local.rebar rebar3 "$RUNNER_TEMP/rebar3-3.25.1" --force
          mix deps.get

      - name: Revalidate locked candidate and current registry state
        id: revalidate
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release_integrity.cjs revalidate

      - name: Publish package
        if: steps.revalidate.outputs.publish != 'false'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

  verify-and-record:
    name: Verify Hex bytes and attach release evidence
    needs: [candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ needs.candidate.outputs.sha }}

      - name: Verify registry metadata, served tarball, and clean consumer
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          EXPECTED_CHECKSUM: ${{ needs.candidate.outputs.checksum }}
        run: |
          node scripts/release_integrity.cjs verify-hex
          bash bin/package_smoke.sh --published "$RELEASE_VERSION"
          node scripts/release_integrity.cjs record-consumer

      - name: Build durable evidence packet
        env:
          RELEASE_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release_evidence.cjs release-candidate.json
