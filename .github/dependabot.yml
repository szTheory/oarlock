version: 2
updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: mix
    directory: "/demo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
